<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" type="text/css" href="../style.css">
    <link rel="stylesheet" type="text/css" href="tutokanstyle.css">

<body onload="getDate()">
    <div id="header">
        <img src="../img/tutokanicon.png" style="width: 100px; height:171px; margin: 10px;">
    </div>
    <div id="indexpage" class="tbcontents">
        <div id="inst">
             趣味で作った漢詩をいくつか、駄作ながら掲載します。
        </div>
        <hr>
        <div class="kansi">
            <div class="inner">
                遂知旦来景全遷<br>
                人馬往来愈盛巡<br>
                曾有在若斯者也<br>
                万人千馬一様春
            </div>
        </div>
        <div class="kakikudashi">
            遂に旦来たるを知りて景全て遷る<br>
            人馬の往来愈々盛んに巡る<br>
            曾て斯くのごとく在る者有りや<br>
            万人千馬一様の春<br>
        </div>
        <div class="disc">
            R8.1.1<br>
            何か元日のうちから近所のショッピングセンターがありえないくらい賑わってたんですが昔の人は正月からあんなに外出してたんですかね。
        </div>
    </div>
