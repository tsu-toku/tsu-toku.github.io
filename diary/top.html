<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../style.css">
    <title>Document</title>
</head>
<body onload="load()">
    <div id="header">
        <img src="../img/diaryicon.png" style="width: 370px; height:100px; margin: 10px;">
    </div>
    <div id="indexpage" class="contents">
        <div id="newest" class="quote">
            <h3 style="margin-top: 5px;">今日の日記</h3>
            <div id="newest_diary"></div>
        </div>
        <div>
        </div>
    </div>
    <script>
        function load(){
            let filePath = "data/26_3.csv"
        var csvData = new Array();
        var data = new XMLHttpRequest();
        data.open("GET", filePath, false); //true:非同期,false:同期
        data.send(null);

        var LF = String.fromCharCode(10); //改行コード
        var lines = data.responseText.split(LF);

        for (var i = 0; i < lines.length;++i) {
            var cells = lines[i].split(",");
            if( cells.length != 1 ) csvData.push(cells);
        }
        console.log(csvData);
        }

    </script>
</body>
</html>
