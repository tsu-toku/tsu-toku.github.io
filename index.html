<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>つーとくのホームページ</title>
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-Control" content="no-cache">
</head>
<body onload="load()">
    <div class="base">
        <div class="sidebar" frameborder="0">
            <iframe src="sidebar.html"width="100%" height="100%"></iframe>
        </div>
        <div class="mainpage">
            <iframe id="mainframe" src="main.html" width="100%" height="100%" name="pageframe"></iframe>
        </div>
    </div>
    <script>
        function load(){
            let param
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            param = urlParams.get('p');
            console.log(param);
            if(param == null)
            document.getElementById("mainframe").src = "main.html";
            else
            document.getElementById("mainframe").src = param;  
        }
    </script>
</body>
</html>
